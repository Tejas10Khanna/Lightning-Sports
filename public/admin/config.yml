# public/admin/config.yml

# --- 1. AUTHORIZATION & BACKEND ---
backend:
  name: github
  repo: Tejas10Khanna/Lightning-Sports 
  branch: main
  # Add this line, using YOUR new Vercel auth app URL:
  base_url: https://lightning-sports-auth-v2.vercel.app/

# --- 2. FILE SAVING LOCATIONS ---
media_folder: "src/content/posts/images"
public_folder: "./images"

# --- 3. THE CONTENT SCHEMA ---
collections:
  - name: "posts"
    label: "Story"
    label_singular: "Story"
    
    folder: "src/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        
      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Subtitle"
        name: "dek"
        widget: "string"
        required: false

      - label: "Byline"
        name: "author"
        widget: "string"
        required: false
        hint: "Enter the credited name. This field is required for AI-assisted stories."

      - label: "AI-assisted"
        name: "aiAssisted"
        widget: "boolean"
        default: false
        required: false
        hint: "Adds an AI-assistance disclosure to the article."
        
      - label: "1. Primary Sport(s) or Multi-Sport Event(s)"
        name: "mainSport"
        widget: "list"
        default: ["Cricket"]
        hint: "Type the main category (e.g., 'Cricket', 'Basketball', 'F1') and hit Enter. You can add as many as you want!"
        
      - label: "2. Tournament or Edition (Deep Route)"
        name: "rawTags"
        widget: "list"
        required: false
        hint: "Enter a tournament or edition, such as T20 World Cup or Paris 2024, and press Enter."
        
      - label: "Featured Pull-Quote"
        name: "featuredQuote"
        widget: "string"
        required: false
        hint: "A short quote to highlight above the article body."
        
      - label: "Story Content"
        name: "body"
        widget: "markdown"
        buttons: 
          - "bold"
          - "italic"
          - "link"
          - "heading-two"
          - "heading-three"
          - "quote"
          - "bulleted-list"
          - "numbered-list"
          - "code"
          # 'table' and 'code-block' are not standard buttons in the base config, 
          # so we remove them to stop the error.
