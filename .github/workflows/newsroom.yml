name: Newsroom intake

on:
  push:
    branches: [main]
    paths:
      - 'newsroom/cricket-intake.py'
      - 'newsroom/cricket-database-intake.py'
      - 'newsroom/run.mjs'
      - '.github/workflows/newsroom.yml'
  pull_request:
    paths:
      - 'newsroom/**'
      - '.github/workflows/newsroom.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: Newsroom stage to run
        type: choice
        default: intake
        options: [intake, draft, groq-test, telegram-test, cricket-intake, cricket-provider-check]
      public_brief:
        description: Optional draft brief JSON using public facts only. Use the secret for private briefs.
        type: string
        required: false
      intake_artifact:
        description: Optional encrypted intake artifact name, such as newsroom-review-123456789-1.
        type: string
        required: false
      lead_id:
        description: Lead ID from the encrypted intake report. Required with intake_artifact.
        type: string
        required: false
      telegram_scenario:
        description: Expected outcome of the Telegram staging test
        type: choice
        default: approve
        options: [approve, edit, reject, timeout]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: newsroom
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Validate the cricket intake adapter
        run: python3 cricket-intake-test.py
      - name: Bundle the Cloudflare review service without deploying
        run: npx --yes wrangler@4.166.0 deploy --dry-run --config approval/wrangler.toml

  collect:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.stage == 'intake') || ((github.event_name == 'schedule' || github.event_name == 'push') && vars.NEWSROOM_ENABLED != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: newsroom-intake
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --prefix newsroom --ignore-scripts --no-audit --no-fund
      - name: Restore recent duplicate keys
        uses: actions/cache/restore@v6
        with:
          path: newsroom/state/seen.json
          key: newsroom-seen-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: newsroom-seen-v1-
      - name: Collect and rank candidates
        env:
          NEWSROOM_SOURCES: ${{ secrets.NEWSROOM_SOURCES }}
          NEWSROOM_REPORT_KEY: ${{ secrets.NEWSROOM_REPORT_KEY }}
        run: node newsroom/run.mjs collect
      - name: Upload encrypted review
        uses: actions/upload-artifact@v7
        with:
          name: newsroom-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: newsroom/state/review.enc
          if-no-files-found: error
          retention-days: 3
      - name: Save recent duplicate keys
        uses: actions/cache/save@v6
        with:
          path: newsroom/state/seen.json
          key: newsroom-seen-v1-${{ github.run_id }}-${{ github.run_attempt }}

  cricket-provider-check:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.stage == 'cricket-provider-check'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Cricket Database match records
        shell: bash
        env:
          NEWSROOM_CRICKET_DATABASE_KEY: ${{ secrets.NEWSROOM_CRICKET_DATABASE_KEY }}
        run: |
          if [[ -z "$NEWSROOM_CRICKET_DATABASE_KEY" ]]; then
            echo "::notice::Cricket Database check skipped because NEWSROOM_CRICKET_DATABASE_KEY is missing."
            exit 0
          fi
          count=$(curl --silent --show-error --fail --max-time 20 --max-filesize 1048576 \
            -H "Authorization: Bearer $NEWSROOM_CRICKET_DATABASE_KEY" -H 'Accept: application/json' \
            'https://api.cricketdatabase.com/v1/matches?limit=5' \
            | jq -ers 'if length == 1 and (.[0].data | type == "array" and all(.[]; type == "object")) then .[0].data | length else error("Invalid results response") end')
          if [[ "$count" -eq 0 ]]; then
            echo "::warning::Cricket Database responded successfully with zero match records."
          else
            echo "Cricket Database returned $count match records. No data was sent to a model or published."
          fi

      - name: Validate brief selection against recent completed matches
        env:
          NEWSROOM_CRICKET_DATABASE_KEY: ${{ secrets.NEWSROOM_CRICKET_DATABASE_KEY }}
        run: |
          python3 newsroom/cricket-database-intake.py "$RUNNER_TEMP/unused-seen" "$RUNNER_TEMP/probe-brief.json" "$RUNNER_TEMP/probe-match-id"
          if [[ -f "$RUNNER_TEMP/probe-brief.json" ]]; then
            jq -e '.sport == "Cricket" and (.evidence | length >= 2)' "$RUNNER_TEMP/probe-brief.json" >/dev/null
            echo "The completed-results response produced an evidence brief."
          fi

  cricket-intake:
    if: github.ref == 'refs/heads/main' && (((github.event_name == 'schedule' || github.event_name == 'push') && vars.NEWSROOM_CRICKET_INTAKE != 'false') || (github.event_name == 'workflow_dispatch' && inputs.stage == 'cricket-intake'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: newsroom-cricket-intake
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Restore previously delivered match IDs
        uses: actions/cache/restore@v6
        with:
          path: newsroom/state/cricket-seen.txt
          key: newsroom-cricket-seen-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: newsroom-cricket-seen-v1-
      - name: Select a recent match and build an evidence brief
        id: scorecard
        env:
          NEWSROOM_CRICKET_DATABASE_KEY: ${{ secrets.NEWSROOM_CRICKET_DATABASE_KEY }}
        run: |
          mkdir -p newsroom/state
          python3 newsroom/cricket-database-intake.py newsroom/state/cricket-seen.txt "$RUNNER_TEMP/cricket-brief.json" "$RUNNER_TEMP/cricket-match-id"
          if [[ -f "$RUNNER_TEMP/cricket-match-id" ]]; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Draft and check the selected cricket editorial
        if: steps.scorecard.outputs.selected == 'true'
        env:
          NEWSROOM_REPORT_KEY: ${{ secrets.NEWSROOM_REPORT_KEY }}
          NEWSROOM_GROQ_API_KEY: ${{ secrets.NEWSROOM_GROQ_API_KEY }}
        run: |
          npm ci --prefix newsroom --ignore-scripts --no-audit --no-fund
          export NEWSROOM_PUBLIC_BRIEF="$(cat "$RUNNER_TEMP/cricket-brief.json")"
          node newsroom/run.mjs draft
      - name: Send the editorial for private review
        if: steps.scorecard.outputs.selected == 'true'
        env:
          NEWSROOM_APPROVAL_URL: ${{ vars.NEWSROOM_APPROVAL_URL }}
          NEWSROOM_INTAKE_TOKEN: ${{ secrets.NEWSROOM_INTAKE_TOKEN }}
          NEWSROOM_REPORT_KEY: ${{ secrets.NEWSROOM_REPORT_KEY }}
        run: |
          node newsroom/run.mjs send-for-review newsroom/state/draft.enc
          printf '%s\n' "$(cat "$RUNNER_TEMP/cricket-match-id")" >> newsroom/state/cricket-seen.txt
          tail -n 1000 newsroom/state/cricket-seen.txt > "$RUNNER_TEMP/cricket-seen.txt"
          mv "$RUNNER_TEMP/cricket-seen.txt" newsroom/state/cricket-seen.txt
      - name: Save processed match IDs
        if: steps.scorecard.outputs.selected == 'true'
        uses: actions/cache/save@v6
        with:
          path: newsroom/state/cricket-seen.txt
          key: newsroom-cricket-seen-v1-${{ github.run_id }}-${{ github.run_attempt }}

  draft:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.stage == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --prefix newsroom --ignore-scripts --no-audit --no-fund
      - name: Validate the optional intake reference
        id: intake
        env:
          INTAKE_ARTIFACT: ${{ inputs.intake_artifact }}
          LEAD_ID: ${{ inputs.lead_id }}
        run: |
          if [[ -z "$INTAKE_ARTIFACT" && -z "$LEAD_ID" ]]; then
            exit 0
          fi
          if [[ ! "$INTAKE_ARTIFACT" =~ ^newsroom-review-([1-9][0-9]*)-[1-9][0-9]*$ ]]; then
            echo "::error::Provide the exact newsroom-review artifact name."
            exit 1
          fi
          run_id="${BASH_REMATCH[1]}"
          if [[ ! "$LEAD_ID" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Provide the matching 64-character lead ID."
            exit 1
          fi
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the encrypted intake report
        if: steps.intake.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.intake_artifact }}
          path: ${{ runner.temp }}/newsroom-intake
          run-id: ${{ steps.intake.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Draft an editorial from the supplied brief
        env:
          NEWSROOM_WRITER_BRIEF: ${{ secrets.NEWSROOM_WRITER_BRIEF }}
          NEWSROOM_PUBLIC_BRIEF: ${{ inputs.public_brief }}
          NEWSROOM_REPORT_KEY: ${{ secrets.NEWSROOM_REPORT_KEY }}
          NEWSROOM_GROQ_API_KEY: ${{ secrets.NEWSROOM_GROQ_API_KEY }}
          NEWSROOM_LEAD_ID: ${{ inputs.lead_id }}
        run: |
          if [[ -n "$NEWSROOM_LEAD_ID" ]]; then
            node newsroom/run.mjs draft-from-lead "$RUNNER_TEMP/newsroom-intake/review.enc" "$NEWSROOM_LEAD_ID"
          else
            node newsroom/run.mjs draft
          fi
      - name: Upload encrypted editorial packet
        uses: actions/upload-artifact@v7
        with:
          name: newsroom-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: newsroom/state/draft.enc
          if-no-files-found: error
          retention-days: 3
      - name: Submit packet to Telegram review
        if: vars.NEWSROOM_APPROVAL_URL != ''
        env:
          NEWSROOM_APPROVAL_URL: ${{ vars.NEWSROOM_APPROVAL_URL }}
          NEWSROOM_INTAKE_TOKEN: ${{ secrets.NEWSROOM_INTAKE_TOKEN }}
          NEWSROOM_REPORT_KEY: ${{ secrets.NEWSROOM_REPORT_KEY }}
        run: node newsroom/run.mjs send-for-review newsroom/state/draft.enc

  groq-test:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.stage == 'groq-test'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Draft and check a fictional football editorial
        env:
          NEWSROOM_GROQ_API_KEY: ${{ secrets.NEWSROOM_GROQ_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { groqWriter, readBrief, writeDraft } from './newsroom/draft.mjs';
          import { checkDraft } from './newsroom/fact-check.mjs';
          const brief = readBrief(JSON.stringify({
            sport: 'Football',
            topic: 'What did Alder FC gain by introducing a second forward when trailing?',
            modelUseApproved: true,
            evidence: [
              { fact: 'Alder FC trailed 1–0 at half-time and brought on a second forward in the 60th minute.', url: 'https://example.test/report' },
              { fact: 'The substitute received the ball inside the area and assisted the 73rd-minute equalizer. The match ended 1–1.', url: 'https://example.test/report' },
              { fact: 'Alder recorded two shots before the substitution and four afterwards. Their opponent also had two late shots on target.', url: 'https://example.test/stats' },
            ],
          }));
          const generate = groqWriter(process.env.NEWSROOM_GROQ_API_KEY);
          const draft = await writeDraft(brief, generate);
          if (draft.status !== 'needs-human-verification') throw new Error('The fictional brief did not produce a draft.');
          const checked = await checkDraft(draft, generate);
          console.log('Groq draft and evidence check completed. Review status: %s.', checked.status);
          JS

  telegram-test:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.stage == 'telegram-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: newsroom-telegram-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Send a fictional draft and verify the selected outcome
        env:
          NEWSROOM_APPROVAL_URL: ${{ vars.NEWSROOM_APPROVAL_URL }}
          NEWSROOM_INTAKE_TOKEN: ${{ secrets.NEWSROOM_INTAKE_TOKEN }}
          NEWSROOM_STAGING_SCENARIO: ${{ inputs.telegram_scenario }}
        run: node newsroom/approval/staging-cli.mjs
